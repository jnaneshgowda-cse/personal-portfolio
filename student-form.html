<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #1f2937;
        }

        .container {
            width: 90%;
            max-width: 650px;

            margin: 50px auto;

            background-color: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2563eb;
        }

        fieldset {
            border: 1px solid #cbd5e1;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            padding: 0 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 11px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border: 2px solid #2563eb;
        }

        .inline-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .inline-group label {
            display: inline;
            font-weight: normal;
            margin: 0;
        }

        .inline-group input {
            width: auto;
            margin-right: 5px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        button {
            padding: 11px 22px;

            border: none;

            border-radius: 8px;

            color: white;

            cursor: pointer;

            font-size: 15px;

            transition: 0.3s;
        }

        .register-btn {
            background-color: #2563eb;
        }

        .register-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        .reset-btn {
            background-color: #6b7280;
        }

        .reset-btn:hover {
            background-color: #4b5563;
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;

            margin-bottom: 20px;

            text-decoration: none;

            color: #2563eb;

            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="index.html" class="back-link">
            ← Back to Portfolio
        </a>

        <h1>Student Registration Form</h1>

        <form>

            <fieldset>

                <legend>Personal Details</legend>

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>


                <label for="age">Age</label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter your age"
                    min="16"
                    max="40"
                    required>


                <label>Gender</label>

                <div class="inline-group">

                    <div>
                        <input
                            type="radio"
                            id="male"
                            name="gender"
                            value="Male">

                        <label for="male">Male</label>
                    </div>


                    <div>
                        <input
                            type="radio"
                            id="female"
                            name="gender"
                            value="Female">

                        <label for="female">Female</label>
                    </div>

                </div>

            </fieldset>


            <fieldset>

                <legend>Academic Details</legend>

                <label for="branch">Branch</label>

                <select id="branch" name="branch">

                    <option value="">Select your branch</option>

                    <option>CSE</option>
                    <option>ISE</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>Mechanical</option>
                    <option>Civil</option>

                </select>


                <label for="semester">Semester</label>

                <select id="semester" name="semester">

                    <option value="">Select semester</option>

                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>

                </select>

            </fieldset>


            <fieldset>

                <legend>Skills</legend>

                <div class="inline-group">

                    <div>
                        <input
                            type="checkbox"
                            id="java"
                            name="skills"
                            value="Java">

                        <label for="java">Java</label>
                    </div>


                    <div>
                        <input
                            type="checkbox"
                            id="python"
                            name="skills"
                            value="Python">

                        <label for="python">Python</label>
                    </div>


                    <div>
                        <input
                            type="checkbox"
                            id="html"
                            name="skills"
                            value="HTML">

                        <label for="html">HTML</label>
                    </div>


                    <div>
                        <input
                            type="checkbox"
                            id="css"
                            name="skills"
                            value="CSS">

                        <label for="css">CSS</label>
                    </div>

                </div>

            </fieldset>


            <fieldset>

                <legend>Additional Information</legend>

                <label for="address">Address</label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your address">
                </textarea>

            </fieldset>


            <div class="buttons">

                <button
                    type="submit"
                    class="register-btn">
                    Register
                </button>

                <button
                    type="reset"
                    class="reset-btn">
                    Reset
                </button>

            </div>

        </form>

    </div>

</body>

</html>
